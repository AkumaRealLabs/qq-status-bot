services:
  app:
    image: ${APP_IMAGE:-ghcr.io/akumareallabs/ai-upstream-monitor:latest}
    build: .
    ports:
      - "127.0.0.1:8090:8090"
    environment:
      DATABASE_DSN: /app/data/monitor.sqlite
      PB_DATA_DB: /app/pb_data/data.db
      BROWSER_DEBUG_URL: http://browser:9222
      BROWSER_PROXY_URL: http://browser:6080
      BROWSER_VNC_URL: /browser/vnc.html?autoconnect=true&resize=scale
      TZ: Asia/Shanghai
    volumes:
      - ./data:/app/data
      - ./pb_data:/app/pb_data:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      - browser
    networks:
      - default
      - ggapi_internal
      - cpa_mixed
    restart: unless-stopped

  browser:
    image: ${BROWSER_IMAGE:-ghcr.io/akumareallabs/ai-upstream-monitor-browser:latest}
    build:
      context: browser
    shm_size: 1gb
    volumes:
      - browser_profile:/profile
    restart: unless-stopped

  llbot:
    image: linyuchen/llbot:latest
    ports:
      - "127.0.0.1:3080:3080"
    expose:
      - "3000"
    volumes:
      - llbot_data:/app/llbot/data
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3080').then(() => process.exit(0), () => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      - app
    restart: unless-stopped

volumes:
  browser_profile:
  llbot_data:

networks:
  ggapi_internal:
    external: true
    name: ggapi_internal
  cpa_mixed:
    external: true
    name: pool-cpa-mixed_default
