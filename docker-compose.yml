name: qq-status-bot

services:
  app:
    container_name: qq-status-bot
    image: ${APP_IMAGE:-ghcr.io/akumareallabs/qq-status-bot:latest}
    build: .
    ports:
      - "127.0.0.1:8090:8090"
    environment:
      QQBOT_APP_ID: ${QQBOT_APP_ID:-}
      QQBOT_APP_SECRET: ${QQBOT_APP_SECRET:-}
      DATA_PATH: /app/data/qq-status.json
      QQBOT_ALLOWED_GROUPS: ${QQBOT_ALLOWED_GROUPS:-}
      STATUS_COMMANDS: ${STATUS_COMMANDS:-状态,status}
      STATUS_URL: ${STATUS_URL:-https://status.ggapi.cc}
      STATUS_PAGE_ID: ${STATUS_PAGE_ID:-default}
      STATUS_PERIOD: ${STATUS_PERIOD:-1y}
      SCREENSHOT_TIMEOUT: ${SCREENSHOT_TIMEOUT:-90s}
      SCREENSHOT_QUEUE_SIZE: ${SCREENSHOT_QUEUE_SIZE:-3}
      TZ: Asia/Shanghai
    volumes:
      - ./data:/app/data:Z
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
