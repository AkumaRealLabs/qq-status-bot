name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "DESIGN.md"
      - "AGENTS.md"
      - ".gitignore"
  pull_request:
    paths-ignore:
      - "**.md"
      - "DESIGN.md"
      - "AGENTS.md"
      - ".gitignore"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on:
      group: org-linux
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Prepare build version
        shell: bash
        run: echo "BUILD_VERSION=$(TZ=Asia/Shanghai date +%Y%m%d%H%M)-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      # main 包 //go:embed frontend/dist，测试前需先构建前端
      - name: Build frontend
        working-directory: frontend
        run: pnpm install --frozen-lockfile && pnpm build
        env:
          VITE_BUILD_VERSION: ${{ env.BUILD_VERSION }}

      - name: Lint frontend
        working-directory: frontend
        run: pnpm lint

      - name: Run Go tests
        run: go test ./...
