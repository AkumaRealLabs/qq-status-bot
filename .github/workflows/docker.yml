name: Docker

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  GHCR_OWNER: akumareallabs

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: images
        run: |
          repo="${GITHUB_REPOSITORY#*/}"
          repo="${repo,,}"
          echo "app=ghcr.io/${GHCR_OWNER}/${repo}" >> "$GITHUB_OUTPUT"
          echo "browser=ghcr.io/${GHCR_OWNER}/${repo}-browser" >> "$GITHUB_OUTPUT"

      - id: app-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.images.outputs.app }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.app-meta.outputs.tags }}
          labels: ${{ steps.app-meta.outputs.labels }}

      - id: browser-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.images.outputs.browser }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: browser/Dockerfile
          push: true
          tags: ${{ steps.browser-meta.outputs.tags }}
          labels: ${{ steps.browser-meta.outputs.labels }}
